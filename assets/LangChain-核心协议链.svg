<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc">
<title id="title">核心协议：把动作提议接回真实结果</title><desc id="desc">模型提出 Tool Call，执行系统产生 ToolMessage；结构化输出是结果接口，不是事实证明</desc>
<defs>
<marker id="arrow-control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#334155"/></marker>
<marker id="arrow-feedback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#059669"/></marker>
<marker id="arrow-supply" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9 Z" fill="#7C3AED"/></marker>
</defs>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#172033">
<text x="30" y="45" font-size="31" font-weight="650">核心协议：把动作提议接回真实结果</text>
<text x="30" y="78" font-size="17" fill="#526075">Message 交付上下文，Adapter 统一往返协议，工具结果通过 tool_call_id 回到下一轮</text>
<g data-kind="container" data-id="message-chain">
<rect x="30" y="330" width="1140" height="220" rx="22" fill="#EEF6FF" stroke="#94BDE9" stroke-width="1.5"/>
<text x="60" y="366" font-size="21" font-weight="650">应用中的主消息链</text>
</g>
<g data-kind="container" data-id="execution-feedback">
<rect x="405" y="610" width="765" height="215" rx="22" fill="#F0FDF7" stroke="#8DC9AF" stroke-width="1.5"/>
<text x="435" y="646" font-size="21" font-weight="650">执行侧 · 真实动作与反馈</text>
</g>
<path data-kind="edge" data-id="messages-adapter" data-source="messages" data-target="adapter" data-source-side="right" data-target-side="left" data-source-offset="0" data-target-offset="0" data-route="direct" d="M310 455 L455 455" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<path data-kind="edge" data-id="schema-adapter" data-source="schema" data-target="adapter" data-source-side="bottom" data-target-side="top" data-source-offset="0" data-target-offset="-40" data-route="orthogonal" d="M185 255 L185 300 L560 300 L560 400" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-supply)" stroke-dasharray="6 5"/>
<path data-kind="edge" data-id="adapter-provider" data-source="adapter" data-target="provider" data-source-side="top" data-target-side="bottom" data-source-offset="0" data-target-offset="-20" data-route="direct" d="M600 400 L600 255" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<path data-kind="edge" data-id="provider-adapter" data-source="provider" data-target="adapter" data-source-side="bottom" data-target-side="top" data-source-offset="20" data-target-offset="40" data-route="direct" d="M640 255 L640 400" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-feedback)"/>
<path data-kind="edge" data-id="adapter-ai" data-source="adapter" data-target="aimessage" data-source-side="right" data-target-side="left" data-source-offset="0" data-target-offset="0" data-route="direct" d="M745 455 L880 455" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<path data-kind="edge" data-id="ai-result" data-source="aimessage" data-target="structured" data-source-side="top" data-target-side="bottom" data-source-offset="0" data-target-offset="0" data-route="direct" d="M1010 400 L1010 270" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-feedback)"/>
<path data-kind="edge" data-id="ai-execute" data-source="aimessage" data-target="execute" data-source-side="bottom" data-target-side="top" data-source-offset="0" data-target-offset="0" data-route="direct" d="M1010 510 L1010 675" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<path data-kind="edge" data-id="execute-result" data-source="execute" data-target="toolmessage" data-source-side="left" data-target-side="right" data-source-offset="0" data-target-offset="0" data-route="direct" d="M880 730 L745 730" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-feedback)"/>
<path data-kind="edge" data-id="result-messages" data-source="toolmessage" data-target="messages" data-source-side="left" data-target-side="bottom" data-source-offset="0" data-target-offset="0" data-route="orthogonal" d="M455 730 L185 730 L185 510" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-feedback)"/>
<g data-kind="node" data-id="schema">
<rect x="60" y="150" width="250" height="105" rx="14" fill="#FFFFFF" stroke="#BCA8E8" stroke-width="1.7"/>
<text data-kind="node-label" x="185.0" y="187.0" text-anchor="middle" font-size="21" font-weight="650">Tool Schema</text>
<text x="185.0" y="215.0" text-anchor="middle" font-size="16" fill="#526075">名称 · 描述 · 输入结构</text>
<text x="185.0" y="238.0" text-anchor="middle" font-size="16" fill="#526075">应用声明可提议的动作</text>
</g>
<g data-kind="node" data-id="provider">
<rect x="475" y="150" width="290" height="105" rx="14" fill="#FFFFFF" stroke="#BCA8E8" stroke-width="1.7"/>
<text data-kind="node-label" x="620.0" y="198.5" text-anchor="middle" font-size="21" font-weight="650">Provider / LLM</text>
<text x="620.0" y="226.5" text-anchor="middle" font-size="16" fill="#526075">真实模型服务</text>
</g>
<g data-kind="node" data-id="structured">
<rect x="850" y="135" width="320" height="135" rx="14" fill="#F0FDF7" stroke="#8DC9AF" stroke-width="1.7"/>
<text data-kind="node-label" x="1010.0" y="175.5" text-anchor="middle" font-size="20" font-weight="650">Structured Output</text>
<text x="1010.0" y="203.5" text-anchor="middle" font-size="16" fill="#526075">模型级：结构化对象</text>
<text x="1010.0" y="226.5" text-anchor="middle" font-size="16" fill="#526075">Agent 级：structuredResponse</text>
<text x="1010.0" y="249.5" text-anchor="middle" font-size="16" fill="#526075">均以显式配置为前提</text>
</g>
<g data-kind="node" data-id="messages" data-container="message-chain">
<rect x="60" y="400" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#94BDE9" stroke-width="1.7"/>
<text data-kind="node-label" x="185.0" y="439.5" text-anchor="middle" font-size="21" font-weight="650">Messages</text>
<text x="185.0" y="467.5" text-anchor="middle" font-size="16" fill="#526075">角色 · 内容 · 元数据</text>
<text x="185.0" y="490.5" text-anchor="middle" font-size="16" fill="#526075">交付本轮上下文</text>
</g>
<g data-kind="node" data-id="adapter" data-container="message-chain">
<rect x="455" y="400" width="290" height="110" rx="14" fill="#EEF6FF" stroke="#94BDE9" stroke-width="1.7"/>
<text data-kind="node-label" x="600.0" y="439.5" text-anchor="middle" font-size="21" font-weight="650">Model Adapter</text>
<text x="600.0" y="467.5" text-anchor="middle" font-size="16" fill="#526075">标准消息 ↔ 供应商协议</text>
<text x="600.0" y="490.5" text-anchor="middle" font-size="16" fill="#526075">统一响应为 AIMessage</text>
</g>
<g data-kind="node" data-id="aimessage" data-container="message-chain">
<rect x="880" y="400" width="260" height="110" rx="14" fill="#FFFFFF" stroke="#94BDE9" stroke-width="1.7"/>
<text data-kind="node-label" x="1010.0" y="439.5" text-anchor="middle" font-size="21" font-weight="650">AIMessage</text>
<text x="1010.0" y="467.5" text-anchor="middle" font-size="16" fill="#526075">文本或 tool_calls</text>
<text x="1010.0" y="490.5" text-anchor="middle" font-size="16" fill="#526075">动作请求仍只是提议</text>
</g>
<g data-kind="node" data-id="execute" data-container="execution-feedback">
<rect x="880" y="675" width="260" height="110" rx="14" fill="#EEF6FF" stroke="#94BDE9" stroke-width="1.7"/>
<text data-kind="node-label" x="1010.0" y="714.5" text-anchor="middle" font-size="21" font-weight="650">工具执行函数</text>
<text x="1010.0" y="742.5" text-anchor="middle" font-size="16" fill="#526075">重新校验名称、参数与权限</text>
<text x="1010.0" y="765.5" text-anchor="middle" font-size="16" fill="#526075">访问真实环境</text>
</g>
<g data-kind="node" data-id="toolmessage" data-container="execution-feedback">
<rect x="455" y="675" width="290" height="110" rx="14" fill="#F0FDF7" stroke="#8DC9AF" stroke-width="1.7"/>
<text data-kind="node-label" x="600.0" y="714.5" text-anchor="middle" font-size="21" font-weight="650">ToolMessage</text>
<text x="600.0" y="742.5" text-anchor="middle" font-size="16" fill="#526075">tool_call_id 关联调用</text>
<text x="600.0" y="765.5" text-anchor="middle" font-size="16" fill="#526075">携带执行结果或错误</text>
</g>
<text data-kind="relation-label" data-relation-id="messages-adapter" x="382" y="440" text-anchor="middle" font-size="14" fill="#334155" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:5;stroke-linejoin:round">提交上下文</text>
<text data-kind="relation-label" data-relation-id="schema-adapter" x="370" y="286" text-anchor="middle" font-size="14" fill="#7C3AED" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:5;stroke-linejoin:round">工具定义</text>
<text data-kind="relation-label" data-relation-id="adapter-provider" x="595" y="315" text-anchor="end" font-size="14" fill="#334155" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:5;stroke-linejoin:round">请求</text>
<text data-kind="relation-label" data-relation-id="provider-adapter" x="654" y="352" text-anchor="start" font-size="14" fill="#059669" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:5;stroke-linejoin:round">响应</text>
<text data-kind="relation-label" data-relation-id="adapter-ai" x="812" y="440" text-anchor="middle" font-size="14" fill="#334155" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:5;stroke-linejoin:round">统一响应</text>
<text data-kind="relation-label" data-relation-id="ai-result" x="1025" y="310" text-anchor="start" font-size="14" fill="#059669" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:5;stroke-linejoin:round">最终响应</text>
<text data-kind="relation-label" data-relation-id="ai-execute" x="1025" y="590" text-anchor="start" font-size="14" fill="#334155" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:5;stroke-linejoin:round">Tool Call</text>
<text data-kind="relation-label" data-relation-id="execute-result" x="812" y="714" text-anchor="middle" font-size="14" fill="#059669" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:5;stroke-linejoin:round">执行反馈</text>
<text data-kind="relation-label" data-relation-id="result-messages" x="195" y="714" text-anchor="start" font-size="14" fill="#059669" style="paint-order:stroke;stroke:#FFFFFF;stroke-width:5;stroke-linejoin:round">回填消息，作为下一轮观察</text>
<text data-kind="annotation" x="30" y="110" text-anchor="start" font-size="13" fill="#526075">灰：调用与动作提议     绿：响应与结果反馈     紫：工具定义供给</text>
<text data-kind="annotation" x="30" y="855" text-anchor="start" font-size="17" fill="#526075">格式与事实分开判断：Schema 约束形状，应用仍须验收来源、授权与内容</text>
</g>
</svg>
