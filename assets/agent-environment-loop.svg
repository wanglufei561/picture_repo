<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent 与环境形成目标驱动的反馈闭环</title>
  <desc id="desc">目标与成功标准约束 Agent 的感知和行动，行动作用于环境，环境产生观测，终止判断决定继续、完成、失败或交还</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <style>
      .title{font:600 28px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2F2B42}
      .label{font:600 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .small{font:400 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#64748B}
      .edge{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}
      .soft{fill:none;stroke:#94A3B8;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="720" fill="#FFFFFF"/>
  <text x="800" y="58" text-anchor="middle" class="title">Agent 的稳定认知内核</text>

  <rect x="80" y="110" width="310" height="92" rx="18" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
  <text x="235" y="151" text-anchor="middle" class="label">目标与成功标准</text>
  <text x="235" y="178" text-anchor="middle" class="small">定义推进、完成与停止</text>

  <rect x="215" y="270" width="500" height="238" rx="28" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="465" y="312" text-anchor="middle" class="label">Agent</text>
  <rect x="265" y="350" width="170" height="88" rx="16" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="350" y="389" text-anchor="middle" class="label">感知历史</text>
  <text x="350" y="417" text-anchor="middle" class="small">已看见的事实</text>
  <rect x="495" y="350" width="170" height="88" rx="16" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="580" y="389" text-anchor="middle" class="label">选择行动</text>
  <text x="580" y="417" text-anchor="middle" class="small">查询或改变</text>
  <path d="M435 394 H486" class="edge"/>

  <rect x="865" y="300" width="330" height="188" rx="24" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/>
  <text x="1030" y="363" text-anchor="middle" class="label">Environment</text>
  <text x="1030" y="400" text-anchor="middle" class="small">文件 · 进程 · 数据</text>
  <text x="1030" y="429" text-anchor="middle" class="small">网页 · 业务系统</text>

  <rect x="1310" y="316" width="220" height="156" rx="24" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="1420" y="377" text-anchor="middle" class="label">终止判断</text>
  <text x="1420" y="411" text-anchor="middle" class="small">继续还是结束</text>

  <path d="M665 380 C750 330 790 330 855 370" class="edge"/>
  <text x="770" y="328" text-anchor="middle" class="small">Action</text>
  <path d="M865 435 C780 520 545 555 355 448" class="edge"/>
  <text x="665" y="548" text-anchor="middle" class="small">Observation</text>
  <path d="M1195 394 H1300" class="edge"/>
  <path d="M1420 472 C1420 600 715 626 580 447" class="soft"/>
  <text x="1140" y="617" text-anchor="middle" class="small">未满足：反馈进入下一轮</text>

  <path d="M235 202 C235 230 420 230 465 260" class="soft"/>
  <path d="M390 156 C905 90 1380 120 1420 306" class="soft"/>

  <rect x="1300" y="548" width="240" height="90" rx="18" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
  <text x="1420" y="584" text-anchor="middle" class="label">进入终态</text>
  <text x="1420" y="613" text-anchor="middle" class="small">完成 · 失败 · 交还</text>
  <path d="M1420 472 V538" class="edge"/>

  <text x="80" y="675" class="small">认知边界：Agent 只能依据已感知的信息决策；环境事实不会因为模型生成了一段文字而自动改变</text>
</svg>
