<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
 <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#63748c"/></marker>
  <style>
   text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#17243b}
   .title{font-size:36px;font-weight:650}.label{font-size:27px;font-weight:600}.body{font-size:23px}.small{font-size:21px;fill:#52617a}
   .box{stroke:#d8e0ec;stroke-width:1.5;rx:18}.line{fill:none;stroke:#63748c;stroke-width:2.4;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}
  </style>
 </defs>
 <text x="60" y="66" class="title">线程状态、共享记忆与事件观察</text>
 <text x="60" y="110" class="body">同一任务靠检查点续接，跨任务共享由 Store 命名空间决定，观察事件不代替状态依据</text>

 <rect class="box" x="60" y="205" width="420" height="450" fill="#f1f5fd"/>
 <text x="86" y="250" class="label">Checkpointer · SQLite</text>
 <text x="86" y="285" class="small">按 thread_id 选择状态记录</text>
 <rect class="box" x="86" y="315" width="368" height="138" fill="#ffffff"/>
 <text x="108" y="352" class="label">Thread A · 报告待审</text>
 <text x="108" y="391" class="body">Messages / Todos / State 文件</text>
 <text x="108" y="426" class="small">next + tasks.interrupts</text>
 <rect class="box" x="86" y="473" width="368" height="138" fill="#ffffff"/>
 <text x="108" y="510" class="label">Thread B · 独立任务</text>
 <text x="108" y="549" class="body">自己的消息、计划与状态文件</text>
 <text x="108" y="584" class="small">不会自动接入 A 的执行位置</text>

 <rect class="box" x="610" y="330" width="450" height="270" fill="#f4f0fc"/>
 <text x="636" y="373" class="label">Deep Agent × LangGraph</text>
 <text x="636" y="410" class="body">本次运行选择一个 Thread</text>
 <rect x="636" y="438" width="398" height="54" rx="12" fill="#ffffff"/>
 <text x="835" y="472" text-anchor="middle" class="body">Model → Tool / task 子代理</text>
 <text x="636" y="531" class="body">恢复状态 → 执行 → 保存新状态</text>
 <text x="636" y="570" class="small">文件仍按实际 Backend 路由</text>
 <path class="line both" d="M480 407 H610"/>
 <text x="545" y="356" text-anchor="middle" class="small">读取 / 保存</text>
 <text x="545" y="384" text-anchor="middle" class="small">检查点</text>

 <rect class="box" x="1190" y="180" width="350" height="250" fill="#fff8e9"/>
 <text x="1214" y="224" class="label">Store · 跨线程数据</text>
 <text x="1214" y="264" class="small">Namespace：用户 A / 研究助手</text>
 <rect x="1214" y="289" width="302" height="56" rx="12" fill="#ffffff"/>
 <text x="1365" y="325" text-anchor="middle" class="body">偏好文件：先结论，后证据</text>
 <text x="1214" y="380" class="small">相同命名空间共享，换用户隔离</text>
 <text x="1214" y="410" class="small">内存示例，重启后丢失</text>
 <path class="line both" d="M1060 365 H1124 V280 H1190"/>
 <text x="1112" y="212" text-anchor="end" class="small">StoreBackend</text>
 <text x="1112" y="242" text-anchor="end" class="small">/memories/ 路由</text>

 <rect class="box" x="1190" y="595" width="350" height="245" fill="#f8fafc"/>
 <text x="1214" y="639" class="label">Streaming · 观察端</text>
 <text x="1214" y="684" class="body">消息片段 / 工具调用与结果</text>
 <text x="1214" y="723" class="body">节点更新 / 子图执行路径</text>
 <text x="1214" y="775" class="small">观察停止 ≠ 已取消执行</text>
 <text x="1214" y="807" class="small">流结束后仍需检查暂停与状态</text>
 <path class="line" stroke-dasharray="7 6" d="M1060 540 H1124 V690 H1190"/>
 <text x="1140" y="501" class="small">过程事件</text>

 <rect class="box" x="610" y="725" width="450" height="115" fill="#f4f0fc"/>
 <text x="636" y="766" class="label">应用提交新消息或恢复决定</text>
 <text x="636" y="806" class="body">新消息用线程，审批用当前暂停 ID</text>
 <path class="line" d="M810 725 V600"/>
 <text x="834" y="674" class="small">input / Command.resume</text>

 <text x="60" y="703" class="small">重启续接：同一数据库、线程 ID</text>
 <text x="60" y="736" class="small">以及兼容的图、工具与后端配置</text>
 <text x="60" y="894" class="small">概念组合示意：默认 CLI 使用 SQLite 检查点与事件观察；Store 共享由独立离线实验验证，线程隔离不等于宿主目录隔离</text>
</svg>
