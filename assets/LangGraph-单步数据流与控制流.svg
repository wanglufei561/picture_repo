<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="一次 Super-step：数据合并与控制转移">
<defs>
<marker id="arrow-control" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker>
<marker id="arrow-data" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#059669"/></marker>
<marker id="arrow-config" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#7C3AED"/></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:30px;font-weight:650}.subtitle{font-size:16px;fill:#526075}.region{font-size:20px;font-weight:600;fill:#334155}.label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#526075}.relation{font-size:15px;fill:#526075}</style>
</defs>
<text x="40" y="50" class="title" text-anchor="start">一次 Super-step：数据合并与控制转移</text>
<text x="40" y="82" class="subtitle" text-anchor="start">节点提交本次变化；运行时统一更新共享状态，再推进后续任务</text>
<g data-kind="annotation"><path d="M40 106 H76" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-data)"/>
<text x="88" y="111" class="relation" text-anchor="start">状态数据</text>
</g>
<g data-kind="annotation"><path d="M245 106 H281" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-control)"/>
<text x="293" y="111" class="relation" text-anchor="start">条件路由</text>
</g>
<g data-kind="annotation"><path d="M455 106 H491" fill="none" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arrow-config)"/>
<text x="503" y="111" class="relation" text-anchor="start">Command.goto</text>
</g>
<g data-kind="container" data-id="step"><rect x="40" y="145" width="1120" height="505" rx="22" fill="#EEF6FF" stroke="#93BFFC" stroke-width="1.5"/>
<text x="68" y="181" class="region" text-anchor="start">执行步 · 激活节点与统一合并</text>
</g>
<g data-kind="node" data-id="state" data-container="step"><rect x="80" y="225" width="200" height="90" rx="14" fill="#FFFFFF" stroke="#93BFFC" stroke-width="1.6"/>
<text x="180.0" y="263.5" class="label" text-anchor="middle">State</text>
<text x="180.0" y="291.5" class="small" text-anchor="middle">本步共享状态</text>
</g>
<g data-kind="node" data-id="node" data-container="step"><rect x="360" y="225" width="200" height="90" rx="14" fill="#FFFFFF" stroke="#93BFFC" stroke-width="1.6"/>
<text x="460.0" y="263.5" class="label" text-anchor="middle">Node</text>
<text x="460.0" y="291.5" class="small" text-anchor="middle">一个或多个激活节点</text>
</g>
<g data-kind="node" data-id="update" data-container="step"><rect x="640" y="225" width="200" height="90" rx="14" fill="#FFFFFF" stroke="#93BFFC" stroke-width="1.6"/>
<text x="740.0" y="263.5" class="label" text-anchor="middle">Partial Update</text>
<text x="740.0" y="291.5" class="small" text-anchor="middle">节点提交的写入</text>
</g>
<g data-kind="node" data-id="reducer" data-container="step"><rect x="920" y="225" width="200" height="90" rx="14" fill="#FFFFFF" stroke="#93BFFC" stroke-width="1.6"/>
<text x="1020.0" y="263.5" class="label" text-anchor="middle">Reducer</text>
<text x="1020.0" y="291.5" class="small" text-anchor="middle">字段定义的合并语义</text>
</g>
<g data-kind="node" data-id="new-state" data-container="step"><rect x="920" y="485" width="200" height="90" rx="14" fill="#F0FDF7" stroke="#89D3B5" stroke-width="1.6"/>
<text x="1020.0" y="523.5" class="label" text-anchor="middle">New State</text>
<text x="1020.0" y="551.5" class="small" text-anchor="middle">应用更新后的状态</text>
</g>
<g data-kind="node" data-id="router" data-container="step"><rect x="640" y="485" width="200" height="90" rx="14" fill="#FFFFFF" stroke="#93BFFC" stroke-width="1.6"/>
<text x="740.0" y="523.5" class="label" text-anchor="middle">Router</text>
<text x="740.0" y="551.5" class="small" text-anchor="middle">读取已合并状态</text>
</g>
<g data-kind="node" data-id="next" data-container="step"><rect x="360" y="485" width="200" height="90" rx="14" fill="#FFFFFF" stroke="#93BFFC" stroke-width="1.6"/>
<text x="460.0" y="523.5" class="label" text-anchor="middle">Next Node / END</text>
<text x="460.0" y="551.5" class="small" text-anchor="middle">下一步任务或结束</text>
</g>
<path data-kind="edge" data-id="read-state" data-source="state" data-target="node" data-source-side="right" data-target-side="left" data-source-offset="0" data-target-offset="0" data-route="direct" d="M280 270 L360 270" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-data)"/>
<text x="320.0" y="257.0" class="relation" text-anchor="middle" data-kind="relation-label" data-relation-id="read-state">读取</text>
<path data-kind="edge" data-id="submit" data-source="node" data-target="update" data-source-side="right" data-target-side="left" data-source-offset="0" data-target-offset="0" data-route="direct" d="M560 270 L640 270" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-data)"/>
<text x="600.0" y="257.0" class="relation" text-anchor="middle" data-kind="relation-label" data-relation-id="submit">返回</text>
<path data-kind="edge" data-id="reduce" data-source="update" data-target="reducer" data-source-side="right" data-target-side="left" data-source-offset="0" data-target-offset="0" data-route="direct" d="M840 270 L920 270" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-data)"/>
<text x="880.0" y="257.0" class="relation" text-anchor="middle" data-kind="relation-label" data-relation-id="reduce">合并</text>
<path data-kind="edge" data-id="new" data-source="reducer" data-target="new-state" data-source-side="bottom" data-target-side="top" data-source-offset="0" data-target-offset="0" data-route="direct" d="M1020 315 L1020 485" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-data)"/>
<text x="1080" y="407" class="relation" text-anchor="middle" data-kind="relation-label" data-relation-id="new">应用通道更新</text>
<path data-kind="edge" data-id="read-new" data-source="new-state" data-target="router" data-source-side="left" data-target-side="right" data-source-offset="0" data-target-offset="0" data-route="direct" d="M920 530 L840 530" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-data)"/>
<text x="880.0" y="517.0" class="relation" text-anchor="middle" data-kind="relation-label" data-relation-id="read-new">读取</text>
<path data-kind="edge" data-id="route" data-source="router" data-target="next" data-source-side="left" data-target-side="right" data-source-offset="0" data-target-offset="0" data-route="direct" d="M640 530 L560 530" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-control)"/>
<text x="600.0" y="517.0" class="relation" text-anchor="middle" data-kind="relation-label" data-relation-id="route">选路</text>
<path data-kind="edge" data-id="goto" data-source="node" data-target="next" data-source-side="bottom" data-target-side="top" data-source-offset="0" data-target-offset="0" data-route="direct" d="M460 315 L460 485" fill="none" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arrow-config)"/>
<text x="545" y="407" class="relation" text-anchor="middle" data-kind="relation-label" data-relation-id="goto">Command.goto</text>
<text x="80" y="620" class="small" text-anchor="start" data-kind="annotation">Command.update 仍进入状态更新链；goto 由当前节点返回，与独立 Router 是两种控制方式</text>
<text x="40" y="692" class="small" text-anchor="start" data-kind="annotation">同一步节点可并行；Reducer 统一更新语义，不保证数据真实、业务正确或副作用幂等</text>
</svg>